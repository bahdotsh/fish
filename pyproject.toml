[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fish"
version = "0.1.0"
description = "Fish, a team card game played offline over the Offline Protocol SDK."
requires-python = ">=3.10"
dependencies = [
    "offline-protocol-sdk[lan]>=0.31.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13,<17",
    "segno>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx"]

[project.scripts]
fish = "fish.cli:main"

[tool.setuptools.packages.find]
include = ["fish*"]

[tool.setuptools.package-data]
fish = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
