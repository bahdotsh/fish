[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fish"
version = "0.1.0"
description = "Fish, a team card game played offline over the Offline Protocol SDK."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
